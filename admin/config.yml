backend:
  name: github
  repo: datadiversitylab/datadiversitylab.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: resilient-dasik-e50a03.netlify.app

local_backend: true
# change url to a link to the image you want to use, no file paths, must be a URL
logo_url: https://datadiversitylab.github.io/assets/images/logos/logo-dark.svg

media_folder: 'src/assets/images/uploads'
public_folder: '/assets/images/uploads'

collections:
  - name: 'team'
    label: 'Team'
    folder: 'src/team'
    media_folder: '/src/assets/images/our-team'
    public_folder: '/assets/images/our-team'
    create: true
    identifier_field: memberName
    slug: '{{memberName}}'
    fields:
      - { label: 'Member Name', name: 'memberName', widget: 'string', required: true }
      - { label: 'Start year', name: 'memberDate', widget: 'string', required: false, hint: 'For example: 2024. Not needed for the PI.' }
      - { label: 'End year', name: 'memberDateEnd', widget: 'string', required: false, hint: 'Leave empty for current members. For one semester, use the same year as the start.' }
      - { label: 'After the lab: position', name: 'afterRole', widget: 'string', required: false, hint: 'Alumni only. For example: Data Scientist' }
      - { label: 'After the lab: organization', name: 'afterOrg', widget: 'string', required: false, hint: 'For example: Credit One. It is shown as Position, Organization.' }
      - { label: 'After the lab: link', name: 'afterLink', widget: 'string', required: false }
      - { label: 'After the lab (old text, used only if the three fields above are empty)', name: 'currentPosition', widget: 'string', required: false }
      - { label: 'Also published as', name: 'alsoPublishedAs', widget: 'list', required: false, hint: 'Other spellings of the name in papers, one per line. For example: C. Román-Palacios' }
      - { label: 'Member Bio', name: 'memberBio', widget: 'string', required: true }
      - { label: 'Education (degree shown after the name)', name: 'memberEducation', widget: 'select', required: false, options: ['BSc', 'MSc', 'PhD'] }
      - { label: 'Role and status (pick Current or Former, plus the role)', name: 'tags', widget: 'select', default: ['Current'], required: true, options: ['Current', 'Former', 'Honorary', 'Intern', 'MS advising team', 'MSc capstone student', 'PhD student', 'PI', 'Postdoc', Staff, 'Undergraduate student', 'VIP student'], multiple: true }
      - { label: 'Linkedin', name: 'linkedin', widget: 'string', required: false }
      - { label: 'Email', name: 'email', widget: 'string', required: false, hint: 'Shown for current members only.' }
      - { label: 'Github handle (not full link)', name: 'github', widget: 'string', required: false }
      - { label: 'Google Scholar', name: 'scholar', widget: 'string', required: false, hint: 'Full link to the profile.' }
      - { label: 'ORCID', name: 'orcid', widget: 'string', required: false, hint: 'The id, for example 0000-0002-1825-0097, or the full link.' }
      - { label: 'Bluesky', name: 'bluesky', widget: 'string', required: false, hint: 'The handle, for example name.bsky.social, or the full link.' }
      - { label: 'Website', name: 'link', widget: 'string', required: false }
      - { label: 'CV (PDF)', name: 'resume', widget: 'file', required: false, media_folder: '/src/assets/documents/our-team', public_folder: '/assets/documents/our-team' }
      - { label: 'Member Image', name: 'image', widget: 'image', required: false }
      - { label: 'Image Alt', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - { label: 'Date', name: 'date', widget: 'datetime' }
      - { label: 'Co-advisor', name: 'coAdvisor', widget: 'string', required: false }
      - { label: 'Co-advisor website', name: 'coAdvisorLink', widget: 'string', required: false }
      - label: 'Additional affiliations'
        name: 'affiliations'
        widget: 'list'
        required: false
        fields:
          - { label: 'Name', name: 'name', widget: 'string' }
          - { label: 'URL', name: 'url', widget: 'string', required: false }
      
  - name: 'publication'
    label: 'Publications'
    folder: 'src/publications'
    media_folder: '/src/assets/images/publications'
    public_folder: '/assets/images/publications'
    create: true
    identifier_field: publicationTitle
    slug: '{{publicationTitle}}'
    fields:
      - { label: 'Publication Title', name: 'publicationTitle', widget: 'markdown', required: true }
      - { label: 'Author', name: 'publicationAuthor', widget: 'string', required: false }
      - { label: 'Year', name: 'publicationDate', widget: 'string', required: false }
      - { label: 'Month', name: 'publicationMonth', widget: 'select', options: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], required: false }
      - { label: 'Journal Name', name: 'publicationType', widget: 'string', required: false }
      - { label: 'Volume', name: 'publicationVolume', widget: 'string', required: false, hint: 'For example: 75' }
      - { label: 'Issue', name: 'publicationIssue', widget: 'string', required: false, hint: 'For example: 2' }
      - { label: 'Pages or article number', name: 'publicationPages', widget: 'string', required: false, hint: 'For example: 215-230 or e12345' }
      - { label: 'DOI', name: 'publicationDoi', widget: 'string', required: false, hint: 'Only the number, for example: 10.1093/sysbio/syaf001' }
      - { label: 'Abstract', name: 'publicationAbstract', widget: 'markdown', required: true }
      - { label: 'Keywords', name: 'tags', widget: 'list', required: true }
      - { label: 'Image', name: 'image', widget: 'image', required: false }
      - { label: 'PDF', name: 'pdfDocument', widget: 'file', required: false, media_folder: '/src/assets/documents/publications', public_folder: '/assets/documents/publications'}
      - { label: 'Badge', name: 'badgeImage', widget: 'string', required: false }
      - { label: 'PDF Url', name: 'pdfLink', widget: 'string', required: false }
      - { label: 'Web Url', name: 'webLink', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - { label: 'Output type', name: 'outputType', widget: 'select', required: false, options: ['Journal article', 'Preprint', 'Review', 'Commentary', 'Popular writing'] }
      - { label: 'Research areas (fine-grained, e.g. macroevolution)', name: 'researchAreas', widget: 'select', multiple: true, required: false, options: ['Macroevolution', 'Phylogenetics', 'Biogeography', 'Conservation biology', 'Climate change', 'Ecology', 'Biostatistics', 'Machine learning', 'Tools', 'Climate science'] }
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        options:
          - "Biodiversity"
          - "Data Science"
          - "Software"
          - "People"

  - name: 'publicationsPage'
    label: 'Publications page'
    files:
      - label: 'Featured publications (the three papers at the top)'
        name: 'publicationsFeatured'
        file: 'src/_data/publicationsFeatured.json'
        fields:
          - { label: 'Heading', name: 'title', widget: 'string', default: 'Featured publications' }
          - label: 'Papers (choose exactly three)'
            name: 'picks'
            widget: 'list'
            min: 3
            max: 3
            summary: '{{fields.paper}}'
            hint: 'Pick three papers. If one is removed later, the newest papers with a figure fill the gap.'
            fields:
              - { label: 'Paper', name: 'paper', widget: 'relation', collection: 'publication', search_fields: ['publicationTitle'], value_field: '{{slug}}', display_fields: ['publicationTitle'] }
              - { label: 'Why read it (one short line, optional)', name: 'note', widget: 'string', required: false, hint: 'For example: A good first read on deep time' }

  - name: 'toolsPage'
    label: 'Tools and data page'
    files:
      - label: 'Featured tools and data (the three at the top)'
        name: 'toolsFeatured'
        file: 'src/_data/toolsFeatured.json'
        fields:
          - { label: 'Heading', name: 'title', widget: 'string', default: 'Featured tools and data' }
          - label: 'Tools (choose exactly three)'
            name: 'picks'
            widget: 'list'
            min: 3
            max: 3
            summary: '{{fields.tool}}'
            hint: 'Pick three. If one is removed later, the tools with an order number fill the gap.'
            fields:
              - { label: 'Tool', name: 'tool', widget: 'relation', collection: 'tools', search_fields: ['Name'], value_field: '{{slug}}', display_fields: ['Name'] }

  - name: 'grants'
    label: 'Grants'
    folder: 'src/grants'
    media_folder: '/src/assets/images/grants'
    public_folder: '/assets/images/grants'
    create: true
    identifier_field: grantName
    slug: '{{grantName}}'
    fields:
      - { label: 'Name', name: 'grantName', widget: 'string', required: true }
      - { label: 'Subaward', name: 'subawardAmount', widget: 'string', required: false }
      - { label: 'Start year', name: 'startYear', widget: 'number', value_type: 'int', min: 2000, max: 2100, required: true }
      - { label: 'End year', name: 'endYear', widget: 'number', value_type: 'int', min: 2000, max: 2100, required: true, hint: 'A grant is shown as active through its end year.' }
      - { label: 'PI', name: 'pi', widget: 'string', required: false }
      - { label: 'Co-PI(s)', name: 'copi', widget: 'list', required: false }
      - { label: 'Project staff (paid by this grant)', name: 'team', widget: 'relation', collection: 'team', search_fields: ['memberName'], value_field: 'memberName', display_fields: ['memberName'], multiple: true, required: false, hint: 'They show on their own profile with a Project staff tag.' }
      - { label: 'Total amount', name: 'grantAmount', widget: 'string', required: false }
      - { label: 'Description', name: 'grantDesc', widget: 'string', required: false }
      - { label: 'Funder', name: 'tags', widget: 'list', required: true }
      - { label: 'Document', name: 'document', widget: 'file', required: false, media_folder: '/src/assets/documents/grants', public_folder: '/assets/documents/grants' }
      - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Member Image', name: 'image', widget: 'image', required: false }
      - { label: 'Image Alt', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        options:
          - "Biodiversity"
          - "Data Science"
          - "Software"
          - "People"

  - name: 'spaceTech'
    label: 'Space and tech'
    folder: 'src/space-tech'
    media_folder: '/src/assets/images/space'
    public_folder: '/assets/images/space'
    create: true
    extension: 'md'
    format: 'frontmatter'
    identifier_field: title
    slug: '{{title}}'
    summary: '{{title}} ({{type}})'
    sortable_fields: ['order', 'title']
    fields:
      - { label: 'Name', name: 'title', widget: 'string', required: true }
      - { label: 'Type', name: 'type', widget: 'select', options: ['Space', 'Computing'], default: 'Space', hint: 'Spaces show as photo cards. Computing shows as a card with a list of specs.' }
      - { label: 'Short description', name: 'description', widget: 'text', required: false }
      - { label: 'Details', name: 'details', widget: 'list', required: false, hint: 'One short line each. Spaces show them as small tags. Computing shows them as a spec list.' }
      - { label: 'Photos (the first is the cover)', name: 'images', widget: 'list', required: false, field: { label: 'Photo', name: 'image', widget: 'image' } }
      - { label: 'Big label (used when there is no photo)', name: 'highlight', widget: 'string', required: false, hint: 'For example: 4 x A100' }
      - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Link label', name: 'linkLabel', widget: 'string', required: false, hint: 'For example: UA HPC website' }
      - { label: 'Order', name: 'order', widget: 'number', required: false, hint: 'Smaller numbers come first within each group.' }

  - name: 'spacePage'
    label: 'Space and tech page'
    files:
      - label: 'Top of the page'
        name: 'spacePage'
        file: 'src/_data/spacePage.json'
        fields:
          - { label: 'Subtitle', name: 'intro', widget: 'string', required: false }
          - { label: 'Address', name: 'address', widget: 'string', required: false }
          - label: 'Number tiles'
            name: 'tiles'
            widget: 'list'
            max: 4
            summary: '{{fields.value}} {{fields.label}}'
            hint: 'Up to four. For example: 192 GB, RAM on the lab server.'
            fields:
              - { label: 'Number', name: 'value', widget: 'string' }
              - { label: 'Label', name: 'label', widget: 'string' }

  - name: 'labPhotos'
    label: 'Lab photos'
    files:
      - label: 'Photos for Overview and Join us'
        name: 'labPhotos'
        file: 'src/_data/labPhotos.json'
        fields:
          - label: 'Overview carousel (up to 8 events)'
            name: 'overview'
            widget: 'list'
            max: 8
            summary: '{{fields.event}}'
            hint: 'Pick events from Socials. The first photo of each event is used. The caption is optional, for example the names of the people. Without a caption, the event name and year show.'
            fields:
              - { label: 'Event', name: 'event', widget: 'relation', collection: 'socials', search_fields: ['publicationTitle'], value_field: '{{slug}}', display_fields: ['publicationTitle'] }
              - { label: 'Caption', name: 'caption', widget: 'string', required: false }
          - label: 'Join us photos (1 to 5 events)'
            name: 'join'
            widget: 'list'
            min: 1
            max: 5
            summary: '{{fields.event}}'
            hint: 'Pick up to five events from Socials. The first one is shown largest. The first photo of each event is used. Group photos where people smile work best.'
            fields:
              - { label: 'Event', name: 'event', widget: 'relation', collection: 'socials', search_fields: ['publicationTitle'], value_field: '{{slug}}', display_fields: ['publicationTitle'] }

  - name: 'joinPage'
    label: 'Join us page'
    files:
      - label: 'Text of the page'
        name: 'joinPage'
        file: 'src/_data/joinPage.json'
        fields:
          - { label: 'Intro', name: 'intro', widget: 'string', required: false }
          - { label: 'Line under the photos', name: 'photosLine', widget: 'string', required: false, hint: 'Optional. A warm sentence under the photos.' }
          - { label: 'Email', name: 'email', widget: 'string' }
          - label: 'Paths (one card each)'
            name: 'paths'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Key facts', name: 'chips', widget: 'list', required: false, hint: 'Short items, for example: 10 hrs a week' }
              - { label: 'Button label', name: 'buttonLabel', widget: 'string', required: false }
              - { label: 'Button link', name: 'buttonLink', widget: 'string', required: false, hint: 'Leave empty to send an email to the address above.' }
          - { label: 'Steps (how to reach out)', name: 'steps', widget: 'list', required: false }

  - name: 'teamPage'
    label: 'Team page'
    files:
      - label: 'Text and categories'
        name: 'teamPage'
        file: 'src/_data/teamPage.json'
        fields:
          - { label: 'Intro', name: 'intro', widget: 'string', required: false }
          - label: 'Categories, in order'
            name: 'categories'
            widget: 'list'
            summary: '{{fields.plural}}'
            hint: 'The first one is the highest rank. A person with several roles is listed under the highest one. To add a category, add its name to the roles of Team members first, then add it here. A role missing from this list still shows, after the others.'
            fields:
              - { label: 'Role name', name: 'tag', widget: 'string', hint: 'Exactly as it appears in the roles of Team members, for example Postdoc.' }
              - { label: 'Heading (plural)', name: 'plural', widget: 'string', hint: 'For example: Postdoctoral researchers' }
              - { label: 'Label for one person', name: 'singular', widget: 'string', hint: 'For example: Postdoctoral researcher' }

  - name: 'contactPage'
    label: 'Contact page'
    files:
      - label: 'Contact details'
        name: 'contactPage'
        file: 'src/_data/contactPage.json'
        fields:
          - { label: 'Intro', name: 'intro', widget: 'string', required: false }
          - { label: 'Main email', name: 'email', widget: 'string' }
          - label: 'Topics (one card each)'
            name: 'topics'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Email subject', name: 'subject', widget: 'string', hint: 'Filled in when someone opens the email link.' }
              - { label: 'Link text', name: 'action', widget: 'string', required: false, hint: 'What the email link says, for example: Ask a question. Use a different text on each card.' }
              - { label: 'Page link', name: 'pageLink', widget: 'string', required: false, hint: 'For example /join-us/. Leave empty if not needed.' }
              - { label: 'Page link label', name: 'pageLabel', widget: 'string', required: false }
          - label: 'People (who you will hear from)'
            name: 'people'
            widget: 'list'
            summary: '{{fields.person}}'
            hint: 'Photo, email and Bluesky come from their Team profile. The email shows for current members only.'
            fields:
              - { label: 'Person', name: 'person', widget: 'relation', collection: 'team', search_fields: ['memberName'], value_field: 'memberName', display_fields: ['memberName'] }
              - { label: 'Label', name: 'label', widget: 'string', required: false, hint: 'For example: Student lab support. Leave empty to use their title.' }
              - { label: 'Phone', name: 'phone', widget: 'string', required: false }
          - label: 'Visit'
            name: 'visit'
            widget: 'object'
            fields:
              - { label: 'Title', name: 'title', widget: 'string', required: false }
              - { label: 'Note', name: 'note', widget: 'text', required: false }
              - { label: 'Address, one line each', name: 'address', widget: 'list' }
              - { label: 'Latitude', name: 'lat', widget: 'number', value_type: 'float', required: false }
              - { label: 'Longitude', name: 'lng', widget: 'number', value_type: 'float', required: false }

  - name: 'tools'
    label: 'Tools & Data'
    folder: 'src/tools'
    media_folder: '/src/assets/images/tools'
    public_folder: '/assets/images/tools'
    create: true
    identifier_field: Name
    slug: '{{Name}}'
    fields:
      - { label: 'Name', name: 'Name', widget: 'string', required: true }
      - { label: 'Authors', name: 'authors', widget: 'list', required: true }
      - { label: 'Description', name: 'Description', widget: 'markdown', required: false }
      - { label: 'Github', name: 'github', widget: 'string', required: false }
      - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Image', name: 'image', widget: 'image', required: false }
      - { label: 'Image Alt', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        options:
          - "Biodiversity"
          - "Data Science"
          - "Software"
          - "People"
      - label: 'Type tags'
        name: 'tags'
        widget: 'select'
        multiple: true
        required: true
        options:
          - 'Web application'
          - 'Website'
          - 'R package'
          - 'Python library'
          - 'Command-line tool'
          - 'Dataset'
          - 'Supplementary data'

  - name: 'socials'
    label: 'Socials'
    folder: 'src/socials'
    media_folder: '/src/assets/images/socials'
    public_folder: '/assets/images/socials'
    create: true
    identifier_field: publicationTitle
    slug: '{{publicationTitle}}'
    fields:
      - { label: 'Name', name: 'publicationTitle', widget: 'string', required: true }
      - { label: 'Location', name: 'Location', widget: 'string', required: false }
      - { label: 'Year', name: 'publicationDate', widget: 'list', required: true }
      - { label: 'Month', name: 'publicationMonth', widget: 'select', options: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], required: true }
      - { label: 'Description', name: 'publicationAbstract', widget: 'string', required: false }
      - { label: 'Images', name: 'images', widget: 'list', required: false, field: { label: 'Image', name: 'image', widget: 'image' } }
      - { label: 'Tag', name: 'tags', widget: 'string', required: true }
      - { label: 'Link', name: 'webLink', widget: 'string', required: false }
      - { label: 'PDF', name: 'pdfDocument', widget: 'string', required: false }
  - name: 'news'
    label: 'News'
    folder: 'src/news'
    media_folder: '/src/assets/images/news'
    public_folder: '/assets/images/news'
    create: true
    summary: "{{Name}} - {{tags[0]}}"
    identifier_field: body
    sortable_fields: ['tags']
    slug: '{{Name}}-{{tags}}'
    fields:
      - { label: 'Name', name: 'Name', widget: 'string', required: true }
      - { label: 'Tags', name: 'tags', widget: 'list', required: true }
      - { label: 'Order',name: 'order', widget: 'number', required: false }
      - { label: "Body", name: "body", widget: "markdown"}
  - name: "inthenews"
    label: "In the News"
    folder: "src/inthenews"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "newsTitle", widget: "string" }
      - { label: "Outlet", name: "Outlet", widget: "string", required: true }
      - { label: "Year", name: "tags", widget: "list", required: true }
      - { label: "Semester", name: "newsDate", widget: "string" , required: true}
      - { label: "Description", name: "newsDesc", widget: "text" }
      - { label: "Link to article", name: "link", widget: "string", required: false }
      - { label: "Document (PDF)", name: "document", widget: "file", required: false }
      - {
          label: "Images",
          name: "images",
          widget: "list",
          field: { label: "Image", name: "", widget: "image" }
        }
  - name: 'blog'
    label: 'Blog'
    folder: 'src/blog'
    media_folder: '/src/assets/images/blog'
    public_folder: '/assets/images/blog'
    create: true
    identifier_field: title
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'blog-post.html' }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 'Author', name: 'author', widget: 'string', required: false }
      - { label: 'Description', name: 'description', widget: 'text', required: false, hint: 'Short summary shown on the listing card.' }
      - { label: 'Cover Image', name: 'image', widget: 'image', required: false, media_folder: '/src/assets/images/blog', public_folder: '/assets/images/blog' }
      - label: 'Topics'
        name: 'tags'
        widget: 'select'
        multiple: true
        required: false
        hint: 'Pick from the list so topics stay the same on every post. To add a topic, add it to the options of this field in config.yml.'
        options:
          - 'Lab life'
          - 'Research'
          - 'Teaching'
          - 'Tutorial'
          - 'Outreach'
          - 'Mapping'
          - 'Welcome'
          - 'Español'
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'jobs'
    label: 'Jobs'
    folder: 'src/jobs'
    media_folder: '/src/assets/images/jobs'
    public_folder: '/assets/images/jobs'
    create: true
    identifier_field: jobTitle
    slug: '{{jobTitle}}'
    fields:
      - { label: 'Job Title', name: 'jobTitle', widget: 'string', required: true }
      - { label: 'Status', name: 'status', widget: 'select', required: true, default: 'Open', options: ['Open', 'Closed'] }
      - { label: 'Job Start Date', name: 'jobStartDate', widget: 'string', required: false }
      - { label: 'Job Apply By', name: 'jobApplyBy', widget: 'string', required: false }
      - { label: 'Job Description', name: 'jobDesc', widget: 'markdown', required: false }
      - { label: 'Job Pdf', name: 'jobPdf', widget: 'file', required: false, media_folder: '/src/assets/documents/jobs', public_folder: '/assets/documents/jobs' }
      - { label: 'Order',name: 'order', widget: 'number', required: false }
  - name: 'collaborators'
    label: 'Collaborators'
    folder: 'src/collaborators'
    media_folder: '/src/assets/images/collaborators'
    public_folder: '/assets/images/collaborators'
    create: true
    identifier_field: collaboratorName
    slug: '{{collaboratorName}}'
    fields:
      - { label: 'Collaborator Name', name: 'collaboratorName', widget: 'string', required: true }
      - { label: 'Collaborator Title', name: 'collaboratorTitle', widget: 'string', required: false }
      - { label: 'Collaborator Date', name: 'collaboratorDate', widget: 'string', required: false }
      - { label: 'Collaborator Bio', name: 'collaboratorBio', widget: 'string', required: false }
      - { label: 'Tags', name: 'tags', widget: 'list', required: true }
      - { label: 'Linkedin', name: 'linkedin', widget: 'string', required: false }
      - { label: 'Email', name: 'email', widget: 'string', required: false }
      - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Resume', name: 'resume', widget: 'string', required: false }
      - { label: 'Member Image', name: 'image', widget: 'image', required: false }
      - { label: 'Image Alt', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
      - { label: 'Date', name: 'date', widget: 'datetime' }
  - name: 'teachingExperience'
    label: 'Teaching Experience'
    folder: 'src/teachingExperience'
    media_folder: '/src/assets/images/teaching-experience'
    public_folder: '/assets/images/teaching-experience'
    create: true
    identifier_field: title
    slug: '{{title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Rows', name: 'rows', widget: 'list', required: true, fields: [
          { label: 'Year-Semester', name: 'yearSemester', widget: 'string', required: true },
          { label: 'Course', name: 'course', widget: 'string', required: true },
          { label: 'Role', name: 'role', widget: 'string', required: true },
          { label: 'Number of Students', name: 'studentsAmount', widget: 'number', required: true }
        ]
      }
      - { label: 'Year', name: 'year', widget: 'number', required: true }
  - name: 'wiki'
    label: 'Lab manual'
    folder: 'src/wiki'
    media_folder: '/src/assets/images/wiki'
    public_folder: '/assets/images/wiki'
    create: true
    extension: 'md'
    format: 'frontmatter'
    nested:
      depth: 3
      summary: '{{title}}'
    meta:
      path:
        widget: 'string'
        label: 'Path'
        index_file: 'index'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Short description', name: 'summary', widget: 'text', required: false, hint: 'Optional. Shown under the title and used for search engines.' }
      - { label: 'Order', name: 'order', widget: 'number', required: false, hint: 'Lower numbers come first within a section. Pages without a number go last, in alphabetical order.' }
      - { label: 'Show the policy cards below the text', name: 'showPolicies', widget: 'boolean', default: false, required: false, hint: 'Only for the Policies and agreements page.' }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'meetingSchedules'
    label: 'Lab meeting schedules'
    folder: 'src/meetingSchedules'
    create: true
    slug: '{{scheduleYear}}-{{semester}}'
    identifier_field: 'semester'
    summary: '{{scheduleYear}} {{semester}}'
    sortable_fields: ['scheduleYear', 'semester']
    fields:
      - { label: 'Year', name: 'scheduleYear', widget: 'number', value_type: 'int', min: 2023, required: true }
      - { label: 'Semester', name: 'semester', widget: 'select', options: ['Spring', 'Summer', 'Fall'], required: true }
      - { label: 'Meeting day', name: 'meetingDay', widget: 'select', options: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'], required: false, hint: 'Set each semester. It shows at the top of the page.' }
      - { label: 'Meeting time', name: 'meetingTime', widget: 'string', required: false, hint: 'For example: 2:00 pm' }
      - { label: 'Room or link', name: 'meetingPlace', widget: 'string', required: false, hint: 'For example: Harvill 320 and Zoom' }
      - { label: 'Extra note', name: 'meetingInfo', widget: 'string', required: false, hint: 'Optional. In older semesters this holds the whole line, for example: Wednesday at 2:00pm, In-person & Zoom' }
      - label: 'Meetings'
        name: 'meetings'
        widget: 'list'
        required: false
        summary: '{{fields.date}} | {{fields.activity}}'
        fields:
          - { label: 'Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
          - { label: 'Led by', name: 'ledBy', widget: 'string', required: false, hint: 'Use the name as on Team (first name is enough) to show the photo and link to the profile. Write All or TBD when it applies. For a week without a meeting, write No meeting.' }
          - { label: 'Activity', name: 'activity', widget: 'string' }
          - { label: 'Type', name: 'kind', widget: 'select', options: ['Lab meeting', 'Research talk', 'Journal club', 'Paper discussion', 'Introduction to the lab', 'Collaboration', 'Talk', 'Other'], required: false }
          - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Other activities', name: 'body', widget: 'markdown', required: false, hint: 'Journal club, professional development, retreats, notes. Tables and lists work here.' }
  - name: 'labManualSettings'
    label: 'Lab manual and meetings settings'
    files:
      - label: 'Manual sections (menu on the left)'
        name: 'wikiSections'
        file: 'src/_data/wikiSections.json'
        fields:
          - label: 'Sections'
            name: 'sections'
            widget: 'list'
            summary: '{{fields.title}}'
            hint: 'Drag to reorder. The folder name must match the slug, for example src/wiki/lab-manual.'
            fields:
              - { label: 'Name shown in the menu', name: 'title', widget: 'string' }
              - { label: 'Folder name (slug)', name: 'slug', widget: 'string', hint: 'Lowercase, with dashes. Pages in this section live in the folder with this name.' }
      - label: 'Lab meetings page'
        name: 'meetingsPage'
        file: 'src/_data/meetingsPage.json'
        fields:
          - { label: 'Page title', name: 'title', widget: 'string' }
          - { label: 'Introduction', name: 'intro', widget: 'text', required: false }
          - { label: 'How meetings run: heading', name: 'agendaTitle', widget: 'string' }
          - label: 'How meetings run: steps'
            name: 'agenda'
            widget: 'list'
            required: false
            summary: '{{fields.title}}'
            fields:
              - { label: 'Step', name: 'title', widget: 'string' }
              - { label: 'Time', name: 'time', widget: 'string', required: false }
              - { label: 'Bullets', name: 'bullets', widget: 'list', required: false, field: { label: 'Bullet', name: 'bullet', widget: 'text' } }
          - { label: 'Schedule heading', name: 'scheduleTitle', widget: 'string' }
  - name: 'labPolicies'
    label: 'Lab Policies'
    folder: 'src/labPolicies'
    media_folder: '/src/assets/images/lab-policies'
    public_folder: '/assets/images/lab-policies'
    create: true
    identifier_field: title
    slug: '{{title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Description', name: 'body', widget: 'markdown', required: true }
      - { label: 'Link', name: 'link', widget: 'string', required: false }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
  - name: 'transparencys'
    label: 'Transparency cards'
    folder: 'src/transparencys'
    media_folder: '/src/assets/images/transparencys'
    public_folder: '/assets/images/transparencys'
    create: true
    identifier_field: title
    slug: '{{title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Year Range', name: 'yearRange', widget: 'string', required: true }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
  - name: 'studentEvaluations'
    label: 'Student Evaluations'
    folder: 'src/studentEvaluations'
    media_folder: '/src/assets/images/student-evaluations'
    public_folder: '/assets/images/student-evaluations'
    identifier_field: title
    create: true
    slug: '{{title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }
      - { label: 'Order', name: 'order', widget: 'number', required: false }
  - name: 'pages'
    label: "Home page"
    media_folder: '/src/assets/images'
    public_folder: '/assets/images'
    files:
      - label: "Home Page"
        name: "Home"
        file: "src/_data/home.json"
        fields:
          - label: Title
            name: title
            widget: string
          - label: sub title
            name: subTitle
            widget: string
          - label: Description
            name: description
            widget: markdown
          - label: Buttons
            name: buttons
            widget: list
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Link', name: 'link', widget: 'string' }
          - label: Background Images
            name: backgroundImages
            widget: list
            fields:
              - { label: 'Image', name: 'image', widget: 'image' }
          - label: Cards
            name: cards
            widget: list
            fields:
              - { label: Image, name: image, widget: image }
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'markdown' }
      - label: "Home page: announcement, buttons, featured projects"
        name: "homeFeatured"
        file: "src/_data/homeFeatured.json"
        media_folder: '/src/assets/images/home'
        public_folder: '/assets/images/home'
        fields:
          - label: 'Announcement (small note at the top of the page)'
            name: 'announcement'
            widget: 'object'
            collapsed: false
            fields:
              - { label: 'Show it', name: 'show', widget: 'boolean', default: false, hint: 'Turn on only for something that is not a job. While a position under Join us is open, a recruiting note appears on its own.' }
              - { label: 'Text', name: 'text', widget: 'string', required: false }
              - { label: 'Link text', name: 'linkLabel', widget: 'string', required: false, hint: 'For example: Apply' }
              - { label: 'Link', name: 'link', widget: 'string', required: false }
          - label: 'Name and affiliation (small line above the title)'
            name: 'byline'
            widget: 'object'
            collapsed: true
            fields:
              - { label: 'Role', name: 'role', widget: 'string', required: false, hint: 'For example: PI' }
              - { label: 'Name', name: 'name', widget: 'string', required: false }
              - { label: 'Affiliation', name: 'affiliation', widget: 'string', required: false }
              - { label: 'Affiliation link', name: 'link', widget: 'string', required: false, hint: 'Optional. Opens in a new tab.' }
          - { label: 'Statement (what the lab does)', name: 'statement', widget: 'text', hint: 'Two sentences at most. It sits under the lab name. The theme tags below it are built from your publications.' }
          - label: 'Main buttons (under the announcement)'
            name: 'doors'
            widget: 'list'
            required: false
            summary: '{{fields.label}}'
            hint: 'The first button is the strongest. Two is the right number. If this list is empty, the old buttons are used.'
            fields:
              - { label: 'Text', name: 'label', widget: 'string' }
              - { label: 'Link', name: 'link', widget: 'string' }
          - label: 'Lab life (circular photo tree in the banner)'
            name: 'labLife'
            widget: 'object'
            collapsed: true
            hint: 'Papers form the research branch. Socials and MacroData form the community branch. Photos change on every visit, so add them in those places. Turn this off to go back to the single banner photo.'
            fields:
              - { label: 'Show the photo tree', name: 'show', widget: 'boolean', default: true }
              - { label: 'Photos shown on desktop', name: 'count', widget: 'number', value_type: 'int', min: 4, max: 8, default: 6, required: false }
  - name: 'teachingService'
    label: 'Teaching and service'
    files:
      - label: 'Teaching page'
        name: 'teachingPage'
        file: 'src/_data/teachingPage.json'
        fields:
          - { label: 'Page title', name: 'title', widget: 'string' }
          - { label: 'Introduction', name: 'intro', widget: 'text', hint: 'Leave a blank line between paragraphs.' }
          - { label: 'Introduction to the four aspects', name: 'principlesIntro', widget: 'text', required: false }
          - label: 'The four aspects'
            name: 'principles'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Courses heading', name: 'coursesTitle', widget: 'string' }
          - { label: 'Courses introduction', name: 'coursesIntro', widget: 'text' }
          - label: 'Courses'
            name: 'courses'
            widget: 'list'
            summary: '{{fields.name}}'
            fields:
              - { label: 'Name', name: 'name', widget: 'string' }
              - { label: 'When it is offered', name: 'term', widget: 'string', required: false, hint: 'For example: Spring and Fall. Leave empty to show nothing.' }
              - { label: 'Text', name: 'text', widget: 'text' }
          - { label: 'Courses closing note', name: 'coursesOutro', widget: 'text', required: false }
          - { label: 'Tools heading', name: 'toolsTitle', widget: 'string' }
          - { label: 'Tools introduction', name: 'toolsIntro', widget: 'text' }
          - label: 'Tools'
            name: 'tools'
            widget: 'list'
            summary: '{{fields.name}}'
            fields:
              - { label: 'Name', name: 'name', widget: 'string' }
              - { label: 'Text', name: 'text', widget: 'text' }
              - { label: 'Button text', name: 'linkLabel', widget: 'string', required: false }
              - { label: 'Link', name: 'link', widget: 'string', required: false }
          - { label: 'Advising heading', name: 'advisingTitle', widget: 'string' }
          - { label: 'Advising text', name: 'advisingText', widget: 'text' }
      - label: 'Senate page'
        name: 'senatePage'
        file: 'src/_data/senatePage.json'
        fields:
          - { label: 'Page title', name: 'title', widget: 'string' }
          - { label: 'Introduction', name: 'intro', widget: 'text', hint: 'Leave a blank line between paragraphs.' }
          - { label: 'Key take homes heading', name: 'takeawaysTitle', widget: 'string' }
          - { label: 'Key take homes', name: 'takeaways', widget: 'list', field: { label: 'Take home', name: 'takeaway', widget: 'text' } }
          - label: 'Sections'
            name: 'sections'
            widget: 'list'
            summary: '{{fields.heading}}'
            fields:
              - { label: 'Heading', name: 'heading', widget: 'string' }
              - { label: 'Text', name: 'body', widget: 'text', required: false, hint: 'Leave a blank line between paragraphs. Shown above the bullets.' }
              - { label: 'Bullets', name: 'bullets', widget: 'list', required: false, field: { label: 'Bullet', name: 'bullet', widget: 'text' } }
          - { label: 'Name', name: 'contactName', widget: 'string' }
          - { label: 'Unit', name: 'contactUnit', widget: 'string' }
          - { label: 'Email', name: 'contactEmail', widget: 'string', required: false }
          - { label: 'Closing note', name: 'note', widget: 'text', required: false }
      - label: 'Advising page'
        name: 'msAdvising'
        file: 'src/_data/msadvising.json'
        fields:
          - { label: 'Page title', name: 'title', widget: 'string' }
          - { label: 'Introduction', name: 'paragraphOne', widget: 'text', hint: 'Leave a blank line between paragraphs. Web addresses and emails become links on their own.' }
          - label: 'Numbered cards (appointments and links)'
            name: 'numberedCards'
            widget: 'list'
            required: false
            summary: '{{fields.title}}'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'description', widget: 'text', hint: 'Paste a full web address and it becomes a link.' }
          - { label: 'Preparing for a meeting: heading', name: 'secondTitle', widget: 'string' }
          - { label: 'Preparing for a meeting: introduction', name: 'paragraphThree', widget: 'text', required: false }
          - label: 'Preparing for a meeting: cards'
            name: 'advisingCards'
            widget: 'list'
            required: false
            summary: '{{fields.title}}'
            hint: 'Drag to reorder.'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Text', name: 'description', widget: 'text', hint: 'Leave a blank line between paragraphs. Web addresses become links on their own.' }
  - name: 'macrodata'
    label: 'MacroData pages'
    folder: 'src/macrodata'
    media_folder: '/src/assets/images/macrodata'
    public_folder: '/assets/images/macrodata'
    create: true
    extension: 'md'
    format: 'frontmatter'
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: ['title', 'order']
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Subtitle', name: 'subtitle', widget: 'string', required: false }
      - label: 'Menu'
        name: 'eleventyNavigation'
        widget: 'object'
        collapsed: false
        hint: 'How the item appears in the main menu, under Outreach.'
        fields:
          - { label: 'Name in the menu', name: 'key', widget: 'string', hint: 'Usually the same as the title. It must not repeat another menu item.' }
          - { label: 'Parent menu', name: 'parent', widget: 'hidden', default: 'Outreach' }
          - { label: 'Order', name: 'order', widget: 'number', value_type: 'int', default: 500, hint: 'Lower numbers come first.' }
      - { label: 'Banner image', name: 'image', widget: 'image', required: false, media_folder: '/src/assets/images/outreach', public_folder: '/assets/images/outreach' }
      - { label: 'Banner image description', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Poster (PDF or image)', name: 'poster', widget: 'file', required: false, media_folder: '/src/assets/documents/outreach', public_folder: '/assets/documents/outreach', hint: 'A PDF shows a preview on desktop and a button on phones. An image is shown on the page.' }
      - label: 'Links (buttons at the end)'
        name: 'links'
        widget: 'list'
        required: false
        summary: '{{fields.label}}'
        fields:
          - { label: 'Text', name: 'label', widget: 'string' }
          - { label: 'Link', name: 'link', widget: 'string' }
      - { label: 'Topics (small labels)', name: 'topics', widget: 'list', required: false }
      - { label: 'Text', name: 'body', widget: 'markdown', required: false, media_folder: '/src/assets/images/outreach', public_folder: '/assets/images/outreach' }
  - name: 'logos'
    label: 'Logos'
    folder: 'src/logos'
    media_folder: '/src/assets/images/logos'
    public_folder: '/assets/images/logos'
    create: false
    delete: false
    identifier_field: title
    slug: '{{title}}'
    fields:
      - { label: 'Logo Image', name: 'image', widget: 'image', required: true }
  - name: 'favicons'
    label: 'Favicons'
    media_folder: '/src/assets/favicons'
    public_folder: '/assets/favicons'
    files:
      - label: "Favicons refer to directions inside"
        name: "Favicons"
        file: "src/_data/favicons.json"
        fields:
          - label: Directions
            name: readonlyField
            widget: text
            required: false
          - label: Favicon ICO
            name: faviconIco
            widget: image
          - label: Favicon 32x32
            name: faviconBrowser32
            widget: image
          - label: Favicon 16x16
            name: faviconBrowser16
            widget: image
          - label: Apple Touch Icon
            name: appleTouchIcon
            widget: image
          - label: Android Chrome 192
            name: androidChrome192
            widget: image
          - label: Android Chrome 384
            name: androidChrome384
            widget: image
