{#- Icons for the MacroData menu and pages. The name is set per page in src/_data/macrodataMenu.json -#}
{%- macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'book' %}<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7.5h8"/>
{%- elif name == 'target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>
{%- elif name == 'calendar' %}<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == 'code' %}<path d="M8.5 7L3.5 12l5 5M15.5 7l5 5-5 5M13.5 5l-3 14"/>
{%- elif name == 'flag' %}<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>
{%- elif name == 'chart' %}<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>
{%- elif name == 'shield' %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
{%- elif name == 'pin' %}<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>
{%- elif name == 'camera' %}<path d="M4 8h3l1.6-2.5h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/>
{%- elif name == 'news' %}<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9h5M7.5 12.5h9M7.5 15.5h9"/>
{%- elif name == 'users' %}<circle cx="9" cy="8.5" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 5.5a3 3 0 0 1 0 6M18 14.5c1.8.8 3 2.7 3 5.5"/>
{%- else %}<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.300 6-5.400-3.1-5.400 3.1 1.300-6L3.400 9.300l6-.7z"/>
{%- endif %}
</svg>
{%- endmacro -%}
